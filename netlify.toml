# Publicación en Netlify (fase 4b; guía en el backend: docs/despliegue/oracle-cloud.md).
#
# El navegador solo habla con cuadre.click. Netlify reenvía la API al backend (api.cuadre.click),
# así que para el navegador todo es del mismo origen y la sesión y el CSRF funcionan igual que con
# el nginx de Docker Compose (ADR-0007). El backend recibe el Origin https://cuadre.click y lo
# admite con CORS_ALLOWED_ORIGINS.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# API y health check del backend. Con status 200 Netlify actúa como proxy (no redirige).
[[redirects]]
  from = "/api/*"
  to = "https://api.cuadre.click/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/actuator/health"
  to = "https://api.cuadre.click/actuator/health"
  status = 200
  force = true

# SPA: cualquier otra ruta devuelve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Mismas cabeceras de seguridad que nginx/security-headers.conf.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    # 'unsafe-inline' en estilos: los componentes Radix usan atributos style (variables CSS).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Archivos con hash en el nombre: se pueden cachear para siempre; index.html nunca.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
