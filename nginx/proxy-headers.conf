# Datos de la petición original para el backend (server.forward-headers-strategy=framework).
# $http_host conserva el host y el puerto que usó el navegador (por ejemplo localhost:8091): el
# backend compara ese origen con la cabecera Origin para decidir si la petición es del mismo
# origen. Con $host (sin puerto) o el puerto interno de nginx, los POST se rechazarían por CORS.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
